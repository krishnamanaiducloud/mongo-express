# SecurityContextConstraints for mongo-express (the Node.js web admin).
#
# Same restrictions as mongo-portal-restricted: restricted-v2 plus a
# mandatory read-only root filesystem and a minimal volume allowlist.
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: mongo-express-restricted
  annotations:
    kubernetes.io/description: >-
      mongo-express: restricted-v2 plus mandatory read-only root filesystem
      and a minimal volume allowlist.
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities: []
defaultAddCapabilities: []
defaultAllowPrivilegeEscalation: false
requiredDropCapabilities:
  - ALL
readOnlyRootFilesystem: true
runAsUser:
  type: MustRunAsRange
seLinuxContext:
  type: MustRunAs
fsGroup:
  type: MustRunAs
supplementalGroups:
  type: RunAsAny
seccompProfiles:
  - runtime/default
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - projected
  - secret
priority: null
users: []
groups: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mongo-express-scc-use
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["mongo-express-restricted"]
    verbs: ["use"]
