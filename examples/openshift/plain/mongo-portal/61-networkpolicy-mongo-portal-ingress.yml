# Generated from examples/openshift/mongo-portal/overlays/prod (plain YAML, no Kustomize).
# Apply with: oc apply -n <namespace> -f examples/openshift/plain/mongo-portal/
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: mongo-portal
    app.kubernetes.io/part-of: mongo-portal
  name: mongo-portal-ingress
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          policy-group.network.openshift.io/ingress: ""
    ports:
    - port: 8443
      protocol: TCP
  - from:
    - namespaceSelector:
        matchLabels:
          network.openshift.io/policy-group: monitoring
    ports:
    - port: 9090
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mongo-portal
  policyTypes:
  - Ingress
