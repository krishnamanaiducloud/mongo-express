# Cluster-admin, once per cluster: the SecurityContextConstraints and the
# ClusterRole that lets the app's ServiceAccount use it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/part-of: mongo-portal
  name: mongo-portal-scc-use
rules:
- apiGroups:
  - security.openshift.io
  resourceNames:
  - mongo-portal-restricted
  resources:
  - securitycontextconstraints
  verbs:
  - use
---
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities: []
apiVersion: security.openshift.io/v1
defaultAddCapabilities: []
defaultAllowPrivilegeEscalation: false
fsGroup:
  type: MustRunAs
groups: []
kind: SecurityContextConstraints
metadata:
  annotations:
    kubernetes.io/description: 'MongoDB portal: restricted-v2 plus mandatory read-only
      root filesystem and a minimal volume allowlist.'
  labels:
    app.kubernetes.io/part-of: mongo-portal
  name: mongo-portal-restricted
priority: null
readOnlyRootFilesystem: true
requiredDropCapabilities:
- ALL
runAsUser:
  type: MustRunAsRange
seLinuxContext:
  type: MustRunAs
seccompProfiles:
- runtime/default
supplementalGroups:
  type: RunAsAny
users: []
volumes:
- configMap
- downwardAPI
- emptyDir
- projected
- secret
