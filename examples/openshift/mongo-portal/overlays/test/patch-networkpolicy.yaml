# Point the MongoDB egress rule at the existing MongoDB pods. Discover the
# values with:
#   oc get pods -A -l <your mongodb label> --show-labels
#   oc get statefulset -A | grep -i mongo
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo-portal-egress
spec:
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - { port: 5353, protocol: UDP }
        - { port: 5353, protocol: TCP }
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: REPLACE-mongodb-namespace
          podSelector:
            matchLabels:
              app.kubernetes.io/name: REPLACE-mongodb-pod-label
      ports:
        - { port: 27017, protocol: TCP }
    - ports:
        - { port: 6443, protocol: TCP }
        - { port: 443, protocol: TCP }
