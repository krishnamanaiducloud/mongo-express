apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Set to the namespace that will host the portal in this environment. It must
# match the Argo CD Application destination namespace.
namespace: mongo-portal-dev

resources:
  - ../../base

components:
  - ../../components/monitoring

# Replaces the base ConfigMap; the content hash in the generated name rolls
# the Deployment whenever configuration changes.
configMapGenerator:
  - name: mongo-portal-config
    behavior: replace
    files:
      - config.yaml

images:
  # The diagnostic variant is used in dev; test and prod use the minimal image.
  - name: docker.io/mohankrishna999/mongo-express
    newName: docker.io/mohankrishna999/mongo-express
    newTag: 0.4.0-debug

replicas:
  - name: mongo-portal
    count: 1

patches:
  - path: patch-rbac.yaml
  - path: patch-networkpolicy.yaml
  - target:
      kind: PodDisruptionBudget
      name: mongo-portal
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
