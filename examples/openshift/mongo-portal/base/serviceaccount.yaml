apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongo-portal
  annotations:
    # Makes this service account an OpenShift OAuth client for the portal's
    # built-in OpenShift login (as with Argo CD's OpenShift connector). The
    # only accepted redirect URIs are on the Route named below
    # (https://<route-host>/oauth/callback).
    serviceaccounts.openshift.io/oauth-redirectreference.primary: >-
      {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"mongo-portal"}}
# The token is the OAuth client secret. The service account needs no RBAC
# permissions: user identity and groups are read with the user's own token.
automountServiceAccountToken: true
