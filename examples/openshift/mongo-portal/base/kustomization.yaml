apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Only the portal's own resources. This kustomization never references the
# existing MongoDB StatefulSet, Services, PVCs or Secrets.
resources:
  - serviceaccount.yaml
  - rbac-scc.yaml
  - rbac-policy.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - networkpolicy.yaml
  - pdb.yaml

labels:
  - pairs:
      app.kubernetes.io/name: mongo-portal
      app.kubernetes.io/part-of: mongo-portal
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false
    includeTemplates: true

images:
  - name: mongo-portal
    newName: docker.io/mohankrishna999/mongo-express
    newTag: 0.4.0

configMapGenerator:
  - name: mongo-portal-config
    files:
      - config.yaml
