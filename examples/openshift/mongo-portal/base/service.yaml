apiVersion: v1
kind: Service
metadata:
  name: mongo-portal
  annotations:
    # OpenShift service CA issues the portal's serving certificate; the Route
    # re-encrypts to it and the router trusts the service CA automatically.
    service.beta.openshift.io/serving-cert-secret-name: mongo-portal-tls
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mongo-portal
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
