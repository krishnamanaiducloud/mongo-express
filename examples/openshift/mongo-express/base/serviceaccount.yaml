apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongo-express
  annotations:
    # Makes this service account the OpenShift OAuth client of the built-in
    # OpenShift login (like Argo CD's OpenShift connector). Only redirect URIs
    # on the Route named below are accepted (https://<route-host>/oauth/callback).
    serviceaccounts.openshift.io/oauth-redirectreference.primary: >-
      {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"mongo-express"}}
# The token is the OAuth client secret. The service account is granted no API
# permissions: the user's identity and groups are read with the user's token.
automountServiceAccountToken: true
---
# Grants this ServiceAccount use of the mongo-express-restricted SCC
# (examples/openshift/cluster) in this namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mongo-express-scc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mongo-express-scc-use
subjects:
  - kind: ServiceAccount
    name: mongo-express
