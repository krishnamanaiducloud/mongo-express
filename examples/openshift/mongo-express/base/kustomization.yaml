apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# mongo-express (the Node.js web admin) on OpenShift. Only its own
# resources; never the MongoDB StatefulSet, Services, PVCs or Secrets.
# Prerequisite: examples/openshift/cluster (SCC mongo-express-restricted) applied once.
resources:
  - serviceaccount.yaml
  - configmap.yaml
  - rbac-policy.yaml
  - deployment.yaml
  - service.yaml
  - route.yaml
  - networkpolicy.yaml
  - pdb.yaml

labels:
  - pairs:
      app.kubernetes.io/name: mongo-express
      app.kubernetes.io/part-of: mongo-express
      app.kubernetes.io/managed-by: argocd
    includeSelectors: false
    includeTemplates: true

images:
  - name: mongo-express
    newName: docker.io/mohankrishna999/mongo-express
    newTag: 0.0.1
