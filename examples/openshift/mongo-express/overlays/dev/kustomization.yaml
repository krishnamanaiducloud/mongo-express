apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Must match the Argo CD Application destination namespace.
namespace: mongo-express-dev

resources:
  - ../../base

images:
  # The diagnostic variant (same application, extra troubleshooting tools).
  - name: docker.io/mohankrishna999/mongo-express
    newName: docker.io/mohankrishna999/mongo-express
    newTag: 0.0.2-debug

patches:
  - path: patch-networkpolicy.yaml
  - path: patch-rbac.yaml
