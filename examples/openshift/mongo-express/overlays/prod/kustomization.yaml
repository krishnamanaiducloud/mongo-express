apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Must match the Argo CD Application destination namespace.
namespace: mongo-express-prod

resources:
  - ../../base

# Minimal image 0.0.2 pinned by immutable digest (multi-arch index, commit 74ec358).
images:
  - name: docker.io/mohankrishna999/mongo-express
    newName: docker.io/mohankrishna999/mongo-express
    digest: sha256:2d97adc4b4b196efc6d207ff5ec0adc4c1704c3b67097f960ef7a0ca1a3167a2

replicas:
  - name: mongo-express
    count: 2

patches:
  - path: patch-networkpolicy.yaml
  - path: patch-rbac.yaml
