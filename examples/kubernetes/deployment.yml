apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
  labels:
    app.kubernetes.io/name: mongo-express
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongo-express
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo-express
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: docker.io/mohankrishna999/mongo-express:0.0.1
          imagePullPolicy: IfNotPresent
          name: mongo-express
          ports:
            - containerPort: 8081
              name: http
          startupProbe:
            httpGet:
              port: http
              path: /status
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              port: http
              path: /status
          readinessProbe:
            httpGet:
              port: http
              path: /status
          env:
            - name: ME_CONFIG_BASICAUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-express-basicauth
                  key: username
            - name: ME_CONFIG_BASICAUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-express-basicauth
                  key: password
          envFrom:
            - configMapRef:
                name: mongo-express-config
            - secretRef:
                name: mongo-express-url
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
