# Who may do what in the portal, in the format of Argo CD's argocd-rbac-cm.
# Re-read every 30 seconds: edit, oc apply, wait. No restart needed, and an
# invalid edit is rejected while the previous policy stays active.
#
#   p, <role>, <resource>, <action>, <object>[, allow|deny]
#   g, <user or group>, <role>
#
# Built-in roles: role:readonly (browse, query, shell without writes),
# role:editor (+ document/index changes, create collections),
# role:admin (everything). Objects: "<db>" or "<db>/<collection>", '*' glob.
# MongoDB still checks every operation with the user's own MongoDB account,
# so the portal can only narrow access. Full reference: docs/portal/rbac.md
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-portal-rbac
  labels:
    app.kubernetes.io/name: mongo-portal
data:
  # Role of every signed-in user the policy does not map ("" grants nothing).
  policy.default: role:readonly
  policy.csv: |
    # OpenShift groups (oc get groups)
    g, REPLACE-sre-group, role:admin
    g, REPLACE-developer-group, role:readonly

    # Used while OpenShift login is unavailable (MongoDB-only sign-in):
    # g, mongodb:REPLACE-sre-mongodb-user@admin, role:admin

    # Example: one team may change one collection only
    # p, role:orders-team, documents, *, app/orders, allow
    # g, REPLACE-orders-group, role:orders-team
