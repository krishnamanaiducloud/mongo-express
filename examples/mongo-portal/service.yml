apiVersion: v1
kind: Service
metadata:
  name: mongo-portal
  labels:
    app.kubernetes.io/name: mongo-portal
  annotations:
    # The OpenShift service CA creates the Secret mongo-portal-tls with the
    # portal's HTTPS certificate and renews it; the Route re-encrypts to it.
    service.beta.openshift.io/serving-cert-secret-name: mongo-portal-tls
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mongo-portal
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
