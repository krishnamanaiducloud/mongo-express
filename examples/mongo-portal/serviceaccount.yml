apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongo-portal
  labels:
    app.kubernetes.io/name: mongo-portal
  annotations:
    # Makes this ServiceAccount the OAuth client of the built-in "Log in with
    # OpenShift" (like Argo CD). Only redirect URIs on the Route named here are
    # accepted (https://<route-host>/oauth/callback). Keep it equal to the
    # Route name in route.yml.
    serviceaccounts.openshift.io/oauth-redirectreference.primary: >-
      {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"mongo-portal"}}
# The token is the OAuth client secret. The ServiceAccount gets no API
# permissions: users' names and groups are read with their own tokens.
automountServiceAccountToken: true
---
# Lets this ServiceAccount use the mongo-portal-restricted SCC (scc.yml) in
# this namespace only. A ServiceAccount subject without a namespace means the
# namespace of this RoleBinding.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mongo-portal-scc
  labels:
    app.kubernetes.io/name: mongo-portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mongo-portal-scc-use
subjects:
  - kind: ServiceAccount
    name: mongo-portal
