# Key the portal uses to protect its sign-in cookies and CSRF tokens. It must
# be random, at least 32 bytes, and the same for all replicas.
#
# Recommended: create it directly instead of applying this file:
#   oc create secret generic mongo-portal-session -n <namespace> \
#     --from-literal=session-key="$(openssl rand -hex 32)"
#
# If you apply this file, replace the value first. The placeholder is too
# short on purpose: the portal rejects it, logs a warning and uses a random
# per-pod key (sign-ins then do not move between replicas).
# Never commit the real value.
apiVersion: v1
kind: Secret
metadata:
  name: mongo-portal-session
  labels:
    app.kubernetes.io/name: mongo-portal
type: Opaque
stringData:
  session-key: "REPLACE-ME"
