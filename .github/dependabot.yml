version: 2
updates:
- package-ecosystem: npm
  directory: '/'
  schedule:
    interval: weekly
  versioning-strategy: increase # Update package.json too
  groups:
    patterns:
      update-types:
        - patch
        - minor
# MongoDB portal (portal/, examples/openshift/)
- package-ecosystem: gomod
  directory: '/portal'
  schedule:
    interval: weekly
  groups:
    go-patterns:
      update-types: [patch, minor]
- package-ecosystem: npm
  directory: '/portal/web'
  schedule:
    interval: weekly
  versioning-strategy: increase
  groups:
    web-patterns:
      update-types: [patch, minor]
- package-ecosystem: docker
  directory: '/portal'
  schedule:
    interval: weekly
- package-ecosystem: github-actions
  directory: '/'
  schedule:
    interval: weekly
