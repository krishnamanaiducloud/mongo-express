apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongo-portal
  annotations:
    # Lets the OAuth proxy use this service account as an OpenShift OAuth
    # client. The redirect URI is derived from the Route named below.
    serviceaccounts.openshift.io/oauth-redirectreference.primary: >-
      {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"mongo-portal"}}
# The token is required by the OAuth proxy (OAuth client) and by the portal
# to read the configured OpenShift Group objects.
automountServiceAccountToken: true
