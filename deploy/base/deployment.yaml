apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-portal
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongo-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo-portal
    spec:
      serviceAccountName: mongo-portal
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      # No runAsUser / fsGroup: OpenShift assigns a namespace UID range under
      # the restricted-v2 SCC; the images run with any UID and GID 0.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mongo-portal
      containers:
        - name: oauth-proxy
          image: oauth-proxy
          imagePullPolicy: IfNotPresent
          args:
            - --provider=openshift
            - --https-address=:8443
            - --http-address=
            - --upstream=http://127.0.0.1:8080
            - --openshift-service-account=mongo-portal
            - --openshift-ca=/etc/pki/tls/cert.pem
            - --openshift-ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            - --cookie-secret-file=/etc/proxy/secrets/cookie-secret
            - --cookie-secure=true
            - --cookie-httponly=true
            - --cookie-expire=8h0m0s
            - --cookie-refresh=1h0m0s
            - --pass-access-token=true
            - --pass-user-headers=true
            - --scope=user:info user:check-access
            - --email-domain=*
            - --skip-provider-button=true
            - --request-logging=false
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /oauth/healthz
              port: https
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /oauth/healthz
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: serving-cert
              mountPath: /etc/tls/private
              readOnly: true
            - name: proxy-secret
              mountPath: /etc/proxy/secrets
              readOnly: true
            - name: proxy-tmp
              mountPath: /tmp
        - name: portal
          image: mongo-portal
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/mongo-portal/config/config.yaml"]
          env:
            - name: PORTAL_SESSION_KEY_FILE
              value: /etc/mongo-portal/session/session-key
            - name: GOMEMLIMIT
              value: 450MiB
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/mongo-portal/config
              readOnly: true
            - name: session-key
              mountPath: /etc/mongo-portal/session
              readOnly: true
            - name: mongodb-ca
              mountPath: /etc/mongo-portal/mongodb-ca
              readOnly: true
            - name: mongodb-client-cert
              mountPath: /etc/mongo-portal/mongodb-client
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: mongo-portal-config
        - name: serving-cert
          secret:
            secretName: mongo-portal-tls          # created by the OpenShift service CA
        - name: proxy-secret
          secret:
            secretName: mongo-portal-proxy        # pre-created: key cookie-secret
        - name: session-key
          secret:
            secretName: mongo-portal-session      # pre-created: key session-key
        # Optional: CA bundle that signed the MongoDB server certificates.
        - name: mongodb-ca
          configMap:
            name: mongo-portal-mongodb-ca
            optional: true
        # Optional: client certificate for MongoDB mutual TLS (tls.crt, tls.key).
        - name: mongodb-client-cert
          secret:
            secretName: mongo-portal-mongodb-client
            optional: true
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: proxy-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
