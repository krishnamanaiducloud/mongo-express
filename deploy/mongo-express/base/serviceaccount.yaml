apiVersion: v1
kind: ServiceAccount
metadata:
  name: mongo-express
# mongo-express does not call the Kubernetes API.
automountServiceAccountToken: false
---
# Grants this ServiceAccount use of the mongo-express-restricted SCC
# (deploy/cluster) in this namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mongo-express-scc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mongo-express-scc-use
subjects:
  - kind: ServiceAccount
    name: mongo-express
