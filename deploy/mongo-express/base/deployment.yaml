apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongo-express
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo-express
      annotations:
        # Admit only under the dedicated SCC (deploy/cluster).
        openshift.io/required-scc: mongo-express-restricted
    spec:
      serviceAccountName: mongo-express
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      # No runAsUser / fsGroup: OpenShift assigns the namespace UID range.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongo-express
          image: mongo-express
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mongo-express-config
            # Existing Secret: ME_CONFIG_MONGODB_URL, ME_CONFIG_SITE_COOKIESECRET,
            # ME_CONFIG_SITE_SESSIONSECRET (see docs/mongo-express-openshift.md).
            - secretRef:
                name: mongo-express-url
          env:
            - name: ME_CONFIG_BASICAUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-express-basicauth
                  key: username
            - name: ME_CONFIG_BASICAUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-express-basicauth
                  key: password
          # /status reports 503 while MongoDB is unreachable (by design of the app).
          startupProbe:
            httpGet:
              path: /status
              port: https
              scheme: HTTPS
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /status
              port: https
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /status
              port: https
              scheme: HTTPS
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: serving-cert
              mountPath: /etc/tls/private
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        # Issued and renewed by the OpenShift service CA (see service.yaml).
        - name: serving-cert
          secret:
            secretName: mongo-express-tls
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
