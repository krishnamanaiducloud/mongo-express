# Non-secret mongo-express settings. Secrets (connection string, cookie and
# session secrets, basic-auth credentials) come from existing Secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-express-config
data:
  ME_CONFIG_BASICAUTH_ENABLED: "true"
  # TLS in the pod with the service-CA certificate (Route re-encrypts).
  ME_CONFIG_SITE_SSL_ENABLED: "true"
  ME_CONFIG_SITE_SSL_CRT_PATH: /etc/tls/private/tls.crt
  ME_CONFIG_SITE_SSL_KEY_PATH: /etc/tls/private/tls.key
  ME_CONFIG_HEALTH_CHECK_PATH: /status
  # Image default; set to "false" to hide server administration features.
  ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
  ME_CONFIG_OPTIONS_CONFIRM_DELETE: "true"
  # MongoDB TLS: set ME_CONFIG_MONGODB_TLS=true and mount the CA, see docs.
