apiVersion: v1
kind: Service
metadata:
  name: mongo-express
  annotations:
    # The OpenShift service CA issues the pod's TLS certificate; the Route
    # re-encrypts to it, so traffic is encrypted end to end.
    service.beta.openshift.io/serving-cert-secret-name: mongo-express-tls
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mongo-express
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
