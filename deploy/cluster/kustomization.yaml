apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Cluster-scoped prerequisites, applied once per cluster by a cluster
# administrator (or the cluster-admin Argo CD application): the
# SecurityContextConstraints used by the portal and mongo-express pods and
# the ClusterRoles that allow using them. Namespaces grant "use" to their
# ServiceAccounts with RoleBindings in the application overlays.
resources:
  - scc-mongo-portal.yaml
  - scc-mongo-express.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: mongo-portal
      app.kubernetes.io/managed-by: argocd
