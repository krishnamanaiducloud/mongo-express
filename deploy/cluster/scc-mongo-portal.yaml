# SecurityContextConstraints for the MongoDB portal pods.
#
# As strict as OpenShift's restricted-v2 (namespace UID range, no privilege
# escalation, all capabilities dropped, RuntimeDefault seccomp, SELinux
# MustRunAs) and additionally *requires* a read-only root filesystem and
# allows only the volume types the portal uses. Pods request it explicitly
# with the openshift.io/required-scc annotation; the ServiceAccount is granted
# "use" by a namespaced RoleBinding (deploy/base/rbac-scc.yaml).
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: mongo-portal-restricted
  annotations:
    kubernetes.io/description: >-
      MongoDB portal: restricted-v2 plus mandatory read-only root filesystem
      and a minimal volume allowlist.
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities: []
defaultAddCapabilities: []
defaultAllowPrivilegeEscalation: false
requiredDropCapabilities:
  - ALL
readOnlyRootFilesystem: true
runAsUser:
  type: MustRunAsRange
seLinuxContext:
  type: MustRunAs
fsGroup:
  type: MustRunAs
supplementalGroups:
  type: RunAsAny
seccompProfiles:
  - runtime/default
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - projected
  - secret
priority: null
users: []
groups: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mongo-portal-scc-use
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["mongo-portal-restricted"]
    verbs: ["use"]
