apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Must match the Argo CD Application destination namespace.
namespace: mongo-portal-prod

resources:
  - ../../base

components:
  - ../../components/monitoring

configMapGenerator:
  - name: mongo-portal-config
    behavior: replace
    files:
      - config.yaml

# Production images are pinned by immutable digest (updated by the release
# pipeline). Current: mongo-portal 0.2.0 (commit 266c53b) and
# origin-oauth-proxy 4.18 (amd64 only; use the Red Hat ose-oauth-proxy image
# from your mirror for supported/arm64 production clusters).
images:
  - name: docker.io/mohankrishna999/mongo-express
    newName: docker.io/mohankrishna999/mongo-express
    digest: sha256:7422334b3057a7852746a134ac86c30bf10a44e2b53e0e4336c8850b66ba3059
  - name: quay.io/openshift/origin-oauth-proxy
    newName: quay.io/openshift/origin-oauth-proxy
    digest: sha256:63b0344b903162519efdb63052c1dde81aa17cfc46ba63cc87300db47f0fb5df

patches:
  - path: patch-cluster-scope.yaml
  - path: patch-networkpolicy.yaml
  - target:
      kind: ClusterRole
      name: mongo-portal-group-reader
    patch: |-
      - op: replace
        path: /metadata/name
        value: mongo-portal-group-reader-prod
  - target:
      kind: ClusterRoleBinding
      name: mongo-portal-group-reader
    patch: |-
      - op: replace
        path: /metadata/name
        value: mongo-portal-group-reader-prod
      - op: replace
        path: /roleRef/name
        value: mongo-portal-group-reader-prod
