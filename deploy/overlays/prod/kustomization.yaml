apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Must match the Argo CD Application destination namespace.
namespace: mongo-portal-prod

resources:
  - ../../base

components:
  - ../../components/monitoring

configMapGenerator:
  - name: mongo-portal-config
    behavior: replace
    files:
      - config.yaml

# Production images are pinned by immutable digest (updated by the release
# pipeline). The tag is informational only.
images:
  - name: docker.io/mohankrishna999/mongo-express
    newName: docker.io/mohankrishna999/mongo-express
    digest: sha256:REPLACED-BY-RELEASE
  - name: quay.io/openshift/origin-oauth-proxy
    newName: quay.io/openshift/origin-oauth-proxy
    digest: sha256:REPLACED-BY-RELEASE

patches:
  - path: patch-cluster-scope.yaml
  - path: patch-networkpolicy.yaml
  - target:
      kind: ClusterRole
      name: mongo-portal-group-reader
    patch: |-
      - op: replace
        path: /metadata/name
        value: mongo-portal-group-reader-prod
  - target:
      kind: ClusterRoleBinding
      name: mongo-portal-group-reader
    patch: |-
      - op: replace
        path: /metadata/name
        value: mongo-portal-group-reader-prod
      - op: replace
        path: /roleRef/name
        value: mongo-portal-group-reader-prod
