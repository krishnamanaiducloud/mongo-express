# Cluster-scoped objects need environment-unique names, the real group names
# and the namespace of the portal ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mongo-portal-group-reader
rules:
  - apiGroups: ["user.openshift.io"]
    resources: ["groups"]
    verbs: ["get"]
    resourceNames:
      - mongo-portal-testelopers-test
      - mongo-portal-sre-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mongo-portal-group-reader
subjects:
  - kind: ServiceAccount
    name: mongo-portal
    namespace: mongo-portal-test
