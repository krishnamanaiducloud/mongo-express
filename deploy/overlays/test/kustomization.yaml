apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Must match the Argo CD Application destination namespace.
namespace: mongo-portal-test

resources:
  - ../../base

components:
  - ../../components/monitoring

configMapGenerator:
  - name: mongo-portal-config
    behavior: replace
    files:
      - config.yaml

images:
  - name: docker.io/mohankrishna999/mongo-express
    newName: docker.io/mohankrishna999/mongo-express
    newTag: 0.2.0

patches:
  - path: patch-cluster-scope.yaml
  - path: patch-networkpolicy.yaml
  - target:
      kind: ClusterRole
      name: mongo-portal-group-reader
    patch: |-
      - op: replace
        path: /metadata/name
        value: mongo-portal-group-reader-test
  - target:
      kind: ClusterRoleBinding
      name: mongo-portal-group-reader
    patch: |-
      - op: replace
        path: /metadata/name
        value: mongo-portal-group-reader-test
      - op: replace
        path: /roleRef/name
        value: mongo-portal-group-reader-test
